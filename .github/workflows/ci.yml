name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & Test
        run: |
          pnpm turbo telemetry disable
          pnpm build
          pnpm test
          node --experimental-strip-types ./tooling/scripts/split-lcov.ts
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

      - name: Upload Coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        run: node --experimental-strip-types ./tooling/scripts/upload-coverage.ts
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  check-changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for Changeset
        run: pnpm exec changeset status --since=origin/${{ github.base_ref }}
